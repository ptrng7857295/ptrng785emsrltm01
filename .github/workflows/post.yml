name: Post Harga Emas ke Threads

on:
  schedule:
    # Jalankan setiap 10 menit
    # Catatan: GitHub Actions minimum 5 menit, bisa telat 1-3 menit
    - cron: '*/10 * * * *'

  # Tombol manual — bisa trigger dari tab Actions di GitHub
  workflow_dispatch:

jobs:
  post-emas:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write   # supaya bisa commit output/latest.png balik ke repo

    steps:

      # ── 1. Ambil kode dari repo ─────────────────────────────
      - name: Checkout repo
        uses: actions/checkout@v4

      # ── 2. Setup Python ────────────────────────────────────
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ── 3. Install library ─────────────────────────────────
      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── 4. Jalankan pipeline ───────────────────────────────
      - name: Fetch → Generate → Post
        env:
          THREADS_USER_ID:      ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          GOLD_API_KEY:         ${{ secrets.GOLD_API_KEY }}
          EXCHANGE_API_KEY:     ${{ secrets.EXCHANGE_API_KEY }}
        run: |
          mkdir -p output
          python main.py

      # ── 5. Commit output/latest.png ke repo ────────────────
      - name: Commit latest.png
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/latest.png
          git diff --staged --quiet || git commit -m "Update latest.png [skip ci]"
          git push

      # ── 6. Simpan gambar sebagai artifact (opsional) ───────
      - name: Upload gambar output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latest-image-${{ github.run_number }}
          path: output/latest.png
          retention-days: 1
